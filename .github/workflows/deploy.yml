name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Serve from the github.io project URL until christa-jarisch.at points to GitHub Pages.
# Once the custom domain is live, delete these two lines (defaults are the custom domain)
# and set the domain under Settings → Pages.
env:
  SITE_URL: https://christa-jarisch.github.io
  BASE_PATH: /website-christa-jarisch-at/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
